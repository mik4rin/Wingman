<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Quill Editor</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
    <style>
        html, body {
          margin: 0;
          padding: 0;
          height: 100%;
        }

        /* Completely hide toolbar and remove it from layout */
        #toolbar-container,
        .ql-toolbar {
          display: none !important;
          visibility: hidden !important;
        }

        /* Full-screen editor */
        #editor-container {
          height: 100%;
          font-size: 18px;
        }

        /* Remove focus outlines/shadows */
        #editor-container:focus,
        .ql-editor:focus {
          outline: none !important;
          box-shadow: none !important;
        }

        .ql-size-8px { font-size: 8px; }
        .ql-size-12px { font-size: 12px; }
        .ql-size-16px { font-size: 16px; }
        .ql-size-18px { font-size: 18px; }
        .ql-size-22px { font-size: 22px; }
        .ql-size-24px { font-size: 24px; }
        .ql-size-28px { font-size: 28px; }
        .ql-size-32px { font-size: 32px; }
        .ql-size-48px { font-size: 48px; }
        .ql-size-64px { font-size: 64px; }
        .ql-size-72px { font-size: 72px; }
        .ql-size-80px { font-size: 80px; }
    </style>
</head>
<body>

<!-- Quill will still internally wire up the toolbar even if it's hidden -->
<div id="toolbar-container">
  <span class="ql-formats">
    <select class="ql-color"></select>
  </span>
</div>

<div id="editor-container"></div>

<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<script>
    var Size = Quill.import('attributors/style/size');
    Size.whitelist = ['8px', '12px', '16px', '18px', '22px', '24px', '28px', '32px', '48px', '64px', '72px', '80px'];
    Quill.register(Size, true);
</script>
<script>
    var quill = new Quill('#editor-container', {
      theme: 'snow',
      placeholder: 'Type something here…',
      modules: {
        toolbar: '#toolbar-container'
      }
    });

    window.quill = quill;

    function openColorPicker() {
      var pickerButton = document.querySelector('.ql-color.ql-picker');
      if (pickerButton) pickerButton.click();
    }

    function applyColorToSelection(color) {
      quill.format('color', color || false);
    }

    function getHtmlContent() {
      return quill.root.innerHTML;
    }

    function setHtmlContent(html) {
      quill.clipboard.dangerouslyPasteHTML(html);
    }

    function sendContentToAndroid() {
      if (window.Android && typeof Android.receiveHtml === "function") {
        Android.receiveHtml(quill.root.innerHTML);
      }
    }

    quill.on('text-change', sendContentToAndroid);
</script>
</body>
</html>
